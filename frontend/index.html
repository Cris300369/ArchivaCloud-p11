<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArchivaCloud</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="page">
      <header class="page-header">
        <h1>ArchivaCloud</h1>
        <button id="uploadButton" type="button" class="btn btn-primary">Subir Archivo</button>
        <h2>Descarga y subida de archivos</h2>
      </header>

      <main>
        <input id="fileInput" type="file" accept=".mov,.mp4" hidden />
        <div id="status" class="status"></div>
        <div class="search-container">
          <input id="searchInput" type="text" placeholder="Buscar archivos..." class="search-bar" />
        </div>
        <section class="table-card">
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Nombre</th>
                  <th>Tamaño</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="filesTableBody">
                <tr>
                  <td colspan="3">Cargando archivos...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
